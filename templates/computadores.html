<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computadores · Asistente IA Compras Públicas</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#e8f0fb',
              100: '#c5d8f5',
              200: '#9bbdee',
              500: '#1e6cc5',
              600: '#154f96',
              700: '#0f3d78',
              800: '#0a2d5e',
              900: '#061e42',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Exportación de PDF 100% client-side -- mismo mecanismo que Medicamentos
       y que el chat legacy de Computadores. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* Transición de "pantalla" al pasar de un paso a otro -- idéntico
       mecanismo que medicamentos.html (#med-screen-enter), solo con el
       prefijo "wiz-" que usa el motor genérico (category_wizard.js). */
    #wiz-screen { transition: opacity .22s ease, transform .22s ease; }
    #wiz-screen.wiz-screen-enter { opacity: 0; transform: translateY(10px) scale(.985); }

    @keyframes wiz-pop { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    .wiz-pop { animation: wiz-pop .22s ease both; }

    /* Estilo "documento" -- compartido entre la vista previa en vivo y el
       PDF real, igual patrón que medicamentos.html. */
    .pdf-wrap { font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #1e293b; padding: 22px; background: #fff; }
    .pdf-wrap .hdr { text-align: center; margin-bottom: 16px; }
    .pdf-wrap .hdr img { height: 34px; width: auto; margin: 0 auto 6px; display: block; }
    .pdf-wrap .hdr h1 { font-size: 16px; margin: 4px 0 2px; }
    .pdf-wrap .hdr p { font-size: 10.5px; color: #64748b; margin: 0; }
    .pdf-wrap .ftr { margin-top: 18px; text-align: center; font-size: 9.5px; color: #94a3b8; }
    .req { margin-bottom: 16px; }
    .req-title { font-size: 13.5px; font-weight: bold; color: #154f96; margin: 0 0 4px; }
    .req-texto { font-size: 11.5px; font-style: italic; color: #475569; }
    .req-desc { font-size: 11px; color: #334155; background: #f8fafc; border-left: 3px solid #154f96; line-height: 1.5; padding: 7px 9px; margin: 6px 0; }
    .req-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .req-table td { border-bottom: 1px solid #e2e8f0; padding: 5px 6px; }
    .req-table .lbl { color: #64748b; width: 42%; }
    .req-table .val { color: #1e293b; font-weight: 600; }

    /* Página de comparación de "revisados" al final del PDF (ver
       revisadosPdfPageHtml en category_wizard.js) -- misma familia visual
       que .req-table, pero con una columna por producto revisado. */
    .cmp-title { font-size: 13.5px; font-weight: bold; color: #154f96; margin: 0 0 10px; }
    .cmp-table { width: 100%; border-collapse: collapse; font-size: 10px; }
    .cmp-table th, .cmp-table td { border: 1px solid #e2e8f0; padding: 5px 6px; text-align: left; vertical-align: top; }
    .cmp-table thead th { background: #f8fafc; color: #334155; font-size: 9.5px; }
    .cmp-table .cmp-lbl { color: #64748b; width: 18%; white-space: nowrap; }
    .cmp-table .cmp-tag { display: inline-block; font-size: 8px; font-weight: bold; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; margin-bottom: 2px; }
    .cmp-table .cmp-tag.ca { background: #d1fae5; color: #047857; }
    .cmp-table .cmp-tag.cm { background: #dbeafe; color: #1d4ed8; }
  </style>
</head>

<body class="h-screen flex flex-col bg-slate-100 overflow-hidden">

  {% set shell_subtitle = "Especificación Técnica Inteligente" %}
  {% include "_header.html" %}

  <div class="flex-1 flex overflow-hidden">
    <!-- ─── Sidebar de historial (formularios guardados, por usuario) ──────
         Oculto en mobile -- ahí el acceso es por el botón de historial que
         ya existe dentro de la pantalla de texto / barra de progreso, que
         abre el mismo listado como modal en vez de sidebar (ver
         openHistorial() en category_wizard.js, reutiliza handleHistorialClick
         para ambos). -->
    <aside id="wiz-history-sidebar" class="hidden lg:flex flex-col w-64 flex-shrink-0 bg-white border-r border-slate-200">
      <div class="px-3 py-3 border-b border-slate-100 flex-shrink-0">
        <button type="button" data-nuevo-formulario
                class="w-full flex items-center justify-center gap-1.5 px-3 py-2 border border-slate-200 hover:border-brand-300 hover:bg-brand-50 text-slate-600 hover:text-brand-700 text-[12.5px] font-semibold rounded-lg transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Nuevo formulario
        </button>
      </div>
      <p class="px-3.5 pt-3 pb-1.5 text-[10px] font-semibold text-slate-400 uppercase tracking-wide flex-shrink-0">Formularios guardados</p>
      <div id="wiz-history-list" class="flex-1 overflow-y-auto px-2 pb-3 space-y-0.5"></div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Barra de progreso + volver -- oculta en la pantalla de texto inicial. -->
      <div id="wiz-progress-wrap" class="hidden flex-shrink-0 bg-white border-b border-slate-200">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
          <button id="wiz-back-btn" type="button" aria-label="Volver"
                  class="flex-shrink-0 w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-brand-600 hover:bg-slate-50 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <div id="wiz-progress-segments" class="flex-1 flex gap-1.5"></div>
          <span id="wiz-price-mini" class="hidden flex-shrink-0 text-[14px] font-extrabold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full transition-opacity duration-150"></span>
          <button type="button" data-abrir-historial aria-label="Formularios guardados"
                  class="lg:hidden flex-shrink-0 w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-brand-600 hover:bg-slate-50 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </button>
        </div>
      </div>

      <!-- Una sola pantalla a la vez, centrada, con vista previa del documento
           a la derecha en pantallas grandes -- mismo layout que medicamentos.html. -->
      <main class="flex-1 overflow-y-auto">
        <div class="min-h-full max-w-7xl mx-auto flex flex-col lg:flex-row items-center lg:items-start justify-center gap-6 lg:gap-10 px-4 py-10">
          <div class="w-full max-w-2xl">
            <div id="wiz-screen" class="w-full"></div>
          </div>
          <aside class="hidden lg:flex flex-col w-full max-w-xl flex-shrink-0 sticky top-10 max-h-[calc(100vh-6rem)]">
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col overflow-hidden">
              <div class="px-4 py-3 border-b border-slate-100 flex items-center gap-2 flex-shrink-0">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <p class="text-[11px] font-semibold text-slate-600 uppercase tracking-wide">Vista previa del documento</p>
              </div>
              <div id="wiz-doc-preview" class="overflow-y-auto flex-1 bg-slate-100 p-3"></div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <!-- ─── Barra flotante del carrito de requerimientos ─────────────── -->
  <div id="cart-bar" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-30">
    <button id="cart-bar-btn" class="flex items-center gap-2.5 pl-4 pr-5 py-3 bg-brand-700 hover:bg-brand-800 text-white rounded-full shadow-lg shadow-brand-900/20 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span class="text-[13.5px] font-semibold"><span id="cart-count">0</span> compra<span id="cart-plural">s</span></span>
      <span class="text-[13px] font-medium text-brand-100 border-l border-white/20 pl-2.5">Ver cotización →</span>
    </button>
  </div>

  <!-- ─── Panel del carrito de requerimientos ──────────────────────── -->
  <div id="cart-panel" class="hidden fixed inset-0 z-40">
    <div id="cart-backdrop" class="absolute inset-0 bg-slate-900/40"></div>
    <div class="absolute inset-y-0 right-0 w-full sm:w-[480px] bg-white shadow-2xl flex flex-col">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 flex-shrink-0">
        <div>
          <h2 class="text-[15px] font-semibold text-slate-800">Mi cotización</h2>
          <p class="text-[12px] text-slate-400"><span id="cart-panel-count">0</span> compra(s) en este requerimiento</p>
        </div>
        <button id="cart-close" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-5 py-4 space-y-3">
        <div id="cart-items" class="space-y-3"></div>
        <div id="wiz-revisados-panel"></div>
      </div>
      <div class="flex-shrink-0 px-5 py-3.5 border-t border-slate-100 space-y-2">
        <button id="cart-pdf-btn" class="w-full flex items-center justify-center gap-2 py-2.5 bg-brand-600 hover:bg-brand-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white text-[13px] font-semibold rounded-lg transition-colors">
          <svg id="cart-pdf-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H8a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Descargar PDF de requerimientos
        </button>
        <button id="cart-empty-btn" class="w-full text-center text-[12.5px] font-medium text-red-500 hover:text-red-600 py-1">Vaciar cotización</button>
      </div>
    </div>
  </div>

  {% include "_session_modal.html" %}

  <script src="/static/js/shell.js"></script>
  <script src="/static/js/computadores_wizard.js"></script>
  <script src="/static/js/category_wizard.js"></script>
</body>
</html>
