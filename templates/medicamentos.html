<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medicamentos · Asistente IA Compras Públicas</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">

  {% include "_tailwind.html" %}

  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/resumen.css" />
  <style>
    /* Transición de "pantalla" al pasar de un paso a otro -- fade + leve
       desplazamiento, para que se sienta como que se va desbloqueando el
       siguiente en vez de que el contenido salte de golpe. */
    #med-screen { transition: opacity .22s ease, transform .22s ease; }
    #med-screen.med-screen-enter { opacity: 0; transform: translateY(10px) scale(.985); }

    /* Fade-in corto para bloques que se re-renderizan in-place (chips que
       reemplazan el mensaje de carga, resultados filtrados, etc.) */
    @keyframes med-pop { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    .med-pop { animation: med-pop .22s ease both; }

    /* Vista previa del documento (técnico, sin precios): misma estructura que
       el PDF que genera el backend (services/pdf_service.py). */
    .pdf-wrap { font-family: 'Inter', Arial, sans-serif; font-size: 12.5px; color: #1e293b; padding: 26px 28px 22px; background: #fff; }
    .pdf-wrap .doc-logo img { height: 28px; width: auto; display: block; }
    .pdf-wrap h1 { font-size: 20px; font-weight: 600; color: #0a2d5e; letter-spacing: -.02em; margin: 14px 0 12px; padding-top: 12px; border-top: 3px solid #0a2d5e; }
    .pdf-wrap .doc-empty { font-size: 12px; color: #64748b; padding: 22px 0 14px; line-height: 1.55; }
    .pdf-wrap .doc-meta { display: grid; grid-template-columns: 1.55fr 1.15fr 1.1fr .8fr; border-top: 1px solid #d9e0ea; border-bottom: 1px solid #d9e0ea; margin-bottom: 22px; }
    .pdf-wrap .doc-meta > div { padding: 9px 12px 9px 14px; border-left: 1px solid #d9e0ea; min-width: 0; }
    .pdf-wrap .doc-meta > div:first-child { padding-left: 0; border-left: 0; }
    .pdf-wrap .doc-meta span { display: block; font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; color: #475569; }
    .pdf-wrap .doc-meta b { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; color: #0f172a; }
    .pdf-wrap .ftr { margin-top: 18px; padding-top: 10px; border-top: 1px solid #d9e0ea; font-size: 9.5px; color: #64748b; }
    .req { margin-bottom: 26px; }
    .req-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .req-num { font-size: 19px; font-weight: 600; color: #1e6cc5; letter-spacing: -.02em; }
    .req-name { flex: 1 1 0; min-width: 0; font-size: 14px; font-weight: 600; color: #0a2d5e; line-height: 1.25; }
    .req-qty { flex-shrink: 0; font-size: 10px; color: #475569; border: 1px solid #d9e0ea; border-radius: 5px; padding: 3px 9px; white-space: nowrap; }
    .req-qty b { font-size: 11px; color: #0f172a; }
    .req-descbox { background: #f6f9fd; border: 1px solid #d9e0ea; border-radius: 6px; padding: 10px 13px; margin-bottom: 12px; }
    .req-descbox p { margin: 0; font-size: 11.5px; line-height: 1.55; color: #1e293b; }
    .req-lbl { margin: 0 0 5px; font-size: 8.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #475569; }
    .req-lbl-blue { color: #0f3d78; }
    .req-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; border: 1px solid #d9e0ea; border-radius: 6px; overflow: hidden; }
    .req-table td { border-bottom: 1px solid #e3e8ef; padding: 6px 12px; }
    .req-table tr:last-child td { border-bottom: 0; }
    .req-table .lbl { color: #475569; width: 44%; }
    .req-table .val { color: #0f172a; font-weight: 600; text-align: right; }
    .req-free { margin: 7px 0 0; font-size: 10px; line-height: 1.5; color: #475569; }
    .req-free b { color: #0f172a; font-weight: 600; }
    .req-draft { border: 1.5px dashed #93c5fd; background: #eff6ff; border-radius: 8px; padding: 12px 14px 4px; margin-bottom: 20px; }
    .req-draft .req { margin-bottom: 12px; }
    .req-draft-tag { margin: 0 0 8px; font-size: 9px; font-weight: 700; color: #1e6cc5; text-transform: uppercase; letter-spacing: .08em; }
  </style>
</head>

<body class="h-screen flex flex-col bg-executive overflow-hidden">

  {% set shell_subtitle = "Selector Guiado de Medicamentos" %}
  {% include "_header.html" %}

  <!-- Barra de progreso + volver -- oculta en la pantalla de texto inicial.
       Solo permite retroceder de a un paso (sin saltar directo a uno lejano). -->
  <div id="med-progress-wrap" class="hidden flex-shrink-0 bg-white border-b border-slate-200">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
      <button id="med-back-btn" type="button" aria-label="Volver"
              class="flex-shrink-0 w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-brand-600 hover:bg-slate-50 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div id="med-progress-segments" class="flex-1 flex gap-1.5"></div>
      <span id="med-price-mini" class="hidden flex-shrink-0 text-[14px] font-extrabold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full transition-opacity duration-150"></span>
    </div>
  </div>

  <!-- Una sola pantalla a la vez, centrada. En pantallas grandes se agrega
       a la derecha una vista previa en vivo del documento de requerimientos
       (carrito + lo que se está armando ahora) -- aprovecha el espacio que
       sobra al lado del wizard angosto. Oculta en mobile (hidden lg:flex). -->
  <main class="flex-1 overflow-y-auto">
    <div class="min-h-full max-w-7xl mx-auto flex flex-col lg:flex-row items-center lg:items-start justify-center gap-6 lg:gap-10 px-4 py-10">
      <div class="w-full max-w-2xl">
        <div id="med-screen" class="w-full"></div>
      </div>
      <aside class="hidden lg:flex flex-col w-full max-w-xl flex-shrink-0 sticky top-10 max-h-[calc(100vh-6rem)]">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-100 flex items-center gap-2 flex-shrink-0">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p class="text-[11px] font-semibold text-slate-600 uppercase tracking-wide">Vista previa del documento</p>
          </div>
          <div id="med-doc-preview" class="overflow-y-auto flex-1 bg-slate-100 p-3"></div>
        </div>
      </aside>
    </div>
  </main>

  <!-- ─── Barra flotante del carrito de requerimientos ─────────────── -->
  <div id="cart-bar" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-30">
    <button id="cart-bar-btn" class="flex items-center gap-2.5 pl-4 pr-5 py-3 bg-brand-700 hover:bg-brand-800 text-white rounded-full shadow-lg shadow-brand-900/20 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span class="text-[13.5px] font-semibold"><span id="cart-count">0</span> requerimiento<span id="cart-plural">s</span></span>
      <span class="text-[13px] font-medium text-brand-100 border-l border-white/20 pl-2.5">Ver cotización →</span>
    </button>
  </div>

  <!-- ─── Panel del carrito de requerimientos ──────────────────────── -->
  <div id="cart-panel" class="hidden fixed inset-0 z-40">
    <div id="cart-backdrop" class="absolute inset-0 bg-slate-900/40"></div>
    <div class="absolute inset-y-0 right-0 w-full sm:w-[480px] bg-white shadow-2xl flex flex-col">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 flex-shrink-0">
        <div>
          <h2 class="text-[15px] font-semibold text-slate-800">Mi cotización</h2>
          <p class="text-[12px] text-slate-400"><span id="cart-panel-count">0</span> requerimiento(s) de compra</p>
        </div>
        <button id="cart-close" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="cart-items" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>
      <div class="flex-shrink-0 px-5 py-3.5 border-t border-slate-100 space-y-2">
        <button id="cart-resumen-btn" type="button" class="w-full flex items-center justify-center gap-2 py-2.5 bg-white border border-brand-200 hover:bg-brand-50 text-brand-700 text-[13px] font-semibold rounded-lg transition-colors">
          Ver resumen ejecutivo
        </button>
        <button id="cart-pdf-btn" class="w-full flex items-center justify-center gap-2 py-2.5 bg-brand-600 hover:bg-brand-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white text-[13px] font-semibold rounded-lg transition-colors">
          <svg id="cart-pdf-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H8a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Descargar PDF técnico
        </button>
        <button id="cart-empty-btn" class="w-full text-center text-[12.5px] font-medium text-red-500 hover:text-red-600 py-1">Vaciar cotización</button>
      </div>
    </div>
  </div>

  <!-- Resumen ejecutivo del requerimiento (static/js/resumen.js) -->
  <div id="resumen-panel" class="hidden" role="dialog" aria-modal="true" aria-label="Resumen ejecutivo del requerimiento"></div>

  {% include "_session_modal.html" %}

  <script src="/static/js/shell.js"></script>
  <script src="/static/js/medicamentos.js"></script>
  <script src="/static/js/resumen.js"></script>
</body>
</html>
